version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      tree-sitter:
        patterns: ['tree-sitter', 'tree-sitter-*']
        update-types: ['patch']
      dev-types:
        patterns: ['@types/*']
        update-types: ['minor', 'patch']
    ignore:
      # 0.x packages break on minor bumps, so ignore both minor and major for
      # the parser family. Upgrade core + grammars together in a dedicated PR.
      - dependency-name: 'tree-sitter*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # Keep the type definitions aligned with the Node runtime major (24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript minors/majors need a matching typescript-eslint release.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Action majors change workflow inputs/outputs and are upgraded manually.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

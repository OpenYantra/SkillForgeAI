name: SkillForgeAI SDLC Quality Gate (evaluate)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: skillforge-eval-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  evaluate-sdlc-gates:
    name: Evaluate SDLC gates (read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Guard protected enforcement paths
        if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'skillforge:policy-change') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // PROTECTED_PATHS guard: enforcement code and policy must be reviewed.
            const patterns = [
              /^src\/core\//,
              /^bin\//,
              /^\.agents\//,
              /^\.github\/workflows\//,
              /^skillforge\.config\.json$/,
              /^gate-policy\.json$/,
            ];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const hit = files
              .map((file) => file.filename)
              .filter((name) => patterns.some((pattern) => pattern.test(name)));
            if (hit.length > 0) {
              core.setFailed(
                `Protected enforcement paths changed: ${hit.join(', ')}. A maintainer must review and add the 'skillforge:policy-change' label.`,
              );
            }

      - name: Checkout base branch (immutable evaluator)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.base_ref || 'main' }}
          path: .skillforge-eval
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare immutable evaluator
        run: ( cd .skillforge-eval && npm ci --ignore-scripts --no-audit --no-fund )

      - name: Audit semantic breaking changes
        run: node .skillforge-eval/bin/skillforge.mjs diff --out diff-report.json

      - name: Evaluate SDLC gates
        run: node .skillforge-eval/bin/skillforge.mjs gate --out gate-report.json

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload gate and diff reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-report
          path: |
            gate-report.json
            diff-report.json
          if-no-files-found: warn

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  node-quality:
    name: Lint, typecheck, and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build native parser bindings (explicit, reviewed step)
        run: npm rebuild tree-sitter tree-sitter-c-sharp tree-sitter-go tree-sitter-javascript tree-sitter-python tree-sitter-typescript

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Check generated context artifacts
        run: node bin/skillforge.mjs graph --check

      - name: Check editor configs
        run: node scripts/sync-editors.mjs --check

      - name: Run tests
        run: npm run test:ts

      - name: Run coverage gate
        run: npm run test:coverage

  dotnet-tests:
    name: .NET tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET test suite
        run: dotnet run --project examples/dotnet-order-service/tests/OrderService.Tests/OrderService.Tests.csproj

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-quality:
    name: Lint, typecheck, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Check generated context artifacts
        run: node bin/skillforge.mjs graph --check

      - name: Check editor configs
        run: node scripts/sync-editors.mjs --check

      - name: Run tests
        run: npm run test:ts

      - name: Run coverage gate
        run: npm run test:coverage

  dotnet-tests:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET test suite
        run: dotnet run --project examples/dotnet-order-service/tests/OrderService.Tests/OrderService.Tests.csproj
